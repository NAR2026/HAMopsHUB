<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

      <span class="admin-pill">ADMIN</span>
    </div>
    <div class="nav-label">Operations</div>
    <button class="nav-item active" data-tab="todayTab"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Today <span class="badge" id="sideBadgeToday">0</span></button>
    <button class="nav-item" data-tab="allFlightsTab"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>All Flights</button>
<button class="nav-item" data-tab="statsTab"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Statistics</button>
<button class="nav-item" data-tab="importTab"><svg class="i" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>WhatsApp Import</button>
<div class="nav-label">Station</div>
<button class="nav-item" data-tab="masterDataTab"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/></svg>Master Data</button>
    <div class="nav-label">Help</div>
    <button class="nav-item" data-tab="aboutTab"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 12h1v5h1"/></svg>About</button>
    <button class="nav-item admin" data-tab="devTab" id="navAdmin" hidden><svg class="i" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>Admin</button>
    <div class="side-foot"><button id="btnAdminExit" hidden>Exit admin mode</button></div>
  </aside>
  <div class="main">
  <header class="topbar">
  <div class="topbar-left"><button class="crumb" id="crumb"></button><h1 id="screenTitle">Today</h1></div>
  <div class="topbar-spacer"></div>
  <div class="topbar-actions">
    <button class="btn-report" id="btnAdminNav" hidden style="background:#B66A00;color:#fff;border-color:#B66A00;"><svg viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg><span class="label">Admin</span></button>
    <button class="btn-report" id="btnReport"><svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><span class="label">Report</span></button>
    <button class="btn-new-flight" id="btnNewFlight"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="label">New Flight</span></button>
    <button class="icon-btn" id="btnTheme"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>
    <section class="screen active" id="todayTab"><div class="content" id="todayContent"></div></section>
    <section class="screen" id="allFlightsTab"><div class="content" id="allFlightsContent"></div></section>
    <section class="screen" id="statsTab"><div class="content" id="statsContent"></div></section>
    <section class="screen" id="importTab"><div class="content" id="importContent"></div></section>
    <section class="screen" id="masterDataTab"><div class="content" id="masterDataContent"></div></section>
    <section class="screen" id="aboutTab"><div class="content" id="aboutContent"></div></section>
    <section class="screen" id="flightFileTab"><div class="content" id="flightFileContent"></div></section>
    <section class="screen" id="checkinTab"><div class="content" id="checkinContent"></div></section>
    <section class="screen" id="devTab"><div class="content" id="devContent"></div></section>
    <nav class="tabbar">
      <button class="active" data-tab="todayTab"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Today</button>
      <button data-tab="allFlightsTab"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Flights</button>
       <button data-tab="statsTab"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Stats</button>
  <button data-tab="importTab"><svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>Import</button>
  <button data-tab="masterDataTab"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>More</button>
</nav>
  </div>
</div>
<div id="modal" class="overlay" hidden>
  <div class="modal" id="modalBox">
    <div class="modal-head"><h2 id="modalTitle">Notice</h2><button class="btn btn-ghost btn-icon btn-sm" id="modalClose"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

  <script src="js/global-boot.js"></script>

</body>
